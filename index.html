<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUE WAVE Academy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e8f8ff, #f5fbff);
  color: #123;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.container {
  width: min(900px, 100%);
  background: white;
  border-radius: 20px;
  padding: 32px;
  box-shadow: 0 10px 35px rgba(0,70,120,.12);
}

header {
  text-align: center;
  margin-bottom: 26px;
}

.logo {
  font-size: 40px;
}

h1 {
  margin: 0;
  color: #0077a8;
  letter-spacing: 2px;
}

.subtitle {
  color: #64808f;
}

h2 {
  color: #123b50;
  font-size: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #087fa8;
  color: white;
  text-align: left;
  padding: 14px;
}

td {
  padding: 14px;
  border-bottom: 1px solid #e4eef2;
}

tbody tr:nth-child(even) {
  background: #f2faff;
}

.time {
  font-weight: bold;
  color: #0077a8;
}

footer {
  text-align: center;
  margin-top: 22px;
  color: #79909b;
  font-size: 13px;
}
</style>
</head>

<body>
<main class="container">

<header>
<div class="logo">🌊</div>
<h1>BLUE WAVE</h1>
<p class="subtitle">Swimming Academy</p>
</header>

<h2>Swimmer Results</h2>

<table>
<thead>
<tr>
<th>#</th>
<th>Swimmer</th>
<th>Swimming Style</th>
<th>Time</th>
</tr>
</thead>

<tbody>
<tr>
<td>1</td>
<td>Ahmad</td>
<td>Freestyle</td>
<td class="time">25.8 sec</td>
</tr>

<tr>
<td>2</td>
<td>Zaid</td>
<td>Backstroke</td>
<td class="time">28.4 sec</td>
</tr>

<tr>
<td>3</td>
<td>Mohammad</td>
<td>Breaststroke</td>
<td class="time">31.2 sec</td>
</tr>

<tr>
<td>4</td>
<td>Omar</td>
<td>Butterfly</td>
<td class="time">27.5 sec</td>
</tr>
</tbody>
</table>

<footer>
BLUE WAVE Swimming Academy · Sample results
</footer>

</main>
</body>
</html>
